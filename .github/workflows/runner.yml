name: 🧪 Godot AI CI Orchestrator
on:
  pull_request:
    branches: ["**"]
  workflow_dispatch:

# The Android build workflow already runs on every push.
# This orchestrator is intentionally limited to PRs and manual runs
# to avoid duplicate push builds.
concurrency:
  group: >-
    ${{ github.workflow }}|
    ${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write

jobs:
  static-checks:
    name: 📊 Static checks
    uses: ./.github/workflows/static_checks.yml

  android-build:
    name: 📱 Android ARM64 APK
    needs: static-checks
    uses: ./.github/workflows/android_builds.yml
