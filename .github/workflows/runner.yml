name: 🧪 Godot AI CI Orchestrator
on:
  pull_request:
    branches: ["**"]
  workflow_dispatch:

# The Android build workflow already runs on every push.
# This orchestrator is intentionally limited to PRs and manual runs
# to avoid duplicate push builds.
concurrency:
  group: >-
    ${{ github.workflow }}|
    ${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write

jobs:
  static-checks:
    name: 📊 Static checks
    uses: ./.github/workflows/static_checks.yml

  android-build:
    name: 📱 Android ARM64 APK
    needs: static-checks
    uses: ./.github/workflows/android_builds.yml

  required-static-check:
    name: 📊 Static Checks
    needs: static-checks
    runs-on: ubuntu-24.04
    steps:
      - name: Confirm static checks passed
        run: echo "Static Checks gate passed."

  required-android-check:
    name: 📱 Android APK
    needs: android-build
    runs-on: ubuntu-24.04
    steps:
      - name: Confirm Android APK check passed
        run: echo "Android APK gate passed."

  required-orchestrator-check:
    name: 🧪 Godot AI CI Orchestrator
    needs:
      - static-checks
      - android-build
    runs-on: ubuntu-24.04
    steps:
      - name: Confirm orchestrator gate passed
        run: echo "Godot AI CI Orchestrator gate passed."
