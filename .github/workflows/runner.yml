name: 📱 Android APK CI
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

# Every push is a separate build checkpoint.
# PR builds may be cancelled when a newer commit supersedes them.
concurrency:
  group: >-
    ${{ github.workflow }}|
    ${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write

jobs:
  static-checks:
    name: 📊 Static checks
    uses: ./.github/workflows/static_checks.yml

  android-build:
    name: 📱 Android ARM64 APK
    needs: static-checks
    uses: ./.github/workflows/android_builds.yml
