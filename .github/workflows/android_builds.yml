name: 📱 Android APK
on:
  push:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: write

env:
  SCONS_FLAGS: >-
    dev_mode=yes
    module_text_server_fb_enabled=yes

jobs:
  build-android-apk:
    name: Android Editor ARM64 Release APK
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Restore Godot build cache
        uses: ./.github/actions/godot-cache-restore
        with:
          cache-name: android-editor-arm64
        continue-on-error: true

      - name: Setup Python and SCons
        uses: ./.github/actions/godot-deps

      - name: Download pre-built AccessKit
        shell: sh
        id: accesskit-sdk
        run: |
          if python ./misc/scripts/install_accesskit.py; then
            echo "ACCESSKIT_ENABLED=yes" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::AccessKit installation failed; continuing without AccessKit."
            echo "ACCESSKIT_ENABLED=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Download Swappy
        shell: sh
        id: swappy-sdk
        run: |
          if python ./misc/scripts/install_swappy_android.py; then
            echo "SWAPPY_ENABLED=yes" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Swappy installation failed; continuing without Swappy."
            echo "SWAPPY_ENABLED=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Download Perfetto
        shell: sh
        id: perfetto-sdk
        run: |
          if python ./misc/scripts/install_perfetto.py; then
            echo "PROFILER_ENABLED=perfetto" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Perfetto installation failed; continuing without Perfetto."
            echo "PROFILER_ENABLED=none" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Godot Editor native libraries
        uses: ./.github/actions/godot-build
        with:
          scons-flags: >-
            ${{ env.SCONS_FLAGS }}
            arch=arm64
            production=yes
            profiler=${{ steps.perfetto-sdk.outputs.PROFILER_ENABLED }}
            swappy=${{ steps.swappy-sdk.outputs.SWAPPY_ENABLED }}
            accesskit=${{ steps.accesskit-sdk.outputs.ACCESSKIT_ENABLED }}
            store_release=yes
          platform: android
          target: editor

      - name: Build release APK only
        working-directory: platform/android/java
        shell: bash
        run: |
          ./gradlew generateGodotEditor --no-daemon --stacktrace

          APK_SOURCE="bin/android_editor_builds/android_editor-android-release.apk"
          if [ ! -f "$APK_SOURCE" ]; then
            echo "::error::Release APK was not produced."
            echo "Expected generated editor APK: $APK_SOURCE"
            find bin/android_editor_builds -maxdepth 2 -type f -print || true
            find lib/libs/tools -maxdepth 3 -type f -print || true
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp "$APK_SOURCE" "$GITHUB_WORKSPACE/dist/godot-android-editor-arm64.apk"

      - name: Audit APK runtime payload
        shell: bash
        run: |
          APK="dist/godot-android-editor-arm64.apk"
          echo "## APK runtime payload audit"
          unzip -l "$APK" | grep -E 'lib/arm64-v8a/|AndroidManifest.xml|classes.*\.dex|assets/' | head -n 80 || true
          echo
          echo "Native payload sizes:"
          unzip -l "$APK" | grep 'lib/arm64-v8a/' || true
          echo
          echo "APK size bytes: $(stat -c '%s' "$APK")"

      - name: Validate APK output
        shell: bash
        run: |
          APK="dist/godot-android-editor-arm64.apk"
          test -f "$APK"
          file "$APK"
          du -h "$APK"

          if command -v zipalign >/dev/null 2>&1; then
            zipalign -c -v 4 "$APK"
          else
            ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -type f -name zipalign 2>/dev/null | sort -V | tail -n 1 || true)"
            test -n "$ZIPALIGN"
            "$ZIPALIGN" -c -v 4 "$APK"
          fi

          if command -v apksigner >/dev/null 2>&1; then
            apksigner verify --verbose "$APK"
          else
            APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner 2>/dev/null | sort -V | tail -n 1 || true)"
            test -n "$APKSIGNER"
            "$APKSIGNER" verify --verbose "$APK"
          fi

          echo "APK ready and structurally/signature validated: $APK"

      - name: Publish direct APK release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${GITHUB_SHA:0:12}"

          if gh release view "$TAG" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refreshing APK asset."
            gh release upload "$TAG" \
              dist/godot-android-editor-arm64.apk \
              --repo "${GITHUB_REPOSITORY}" \
              --clobber
          else
            gh release create "$TAG" \
              dist/godot-android-editor-arm64.apk \
              --repo "${GITHUB_REPOSITORY}" \
              --target "${GITHUB_SHA}" \
              --title "Android APK ${GITHUB_SHA:0:12}" \
              --notes "Automatic Android ARM64 release build for commit ${GITHUB_SHA}." \
              --prerelease
          fi

      - name: Build summary
        shell: bash
        run: |
          APK_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/build-${GITHUB_SHA:0:12}/godot-android-editor-arm64.apk"
          {
            echo "## 📱 Android APK"
            echo
            echo "[Download APK directly]($APK_URL)"
            echo
            echo "`godot-android-editor-arm64.apk`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save Godot build cache
        uses: ./.github/actions/godot-cache-save
        with:
          cache-name: android-editor-arm64
        continue-on-error: true
